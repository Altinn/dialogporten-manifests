# edge-syncroot for tt02 environment. Traffic goes through APIM (platform.tt02.altinn.no)
# via the platform-owned Backend; dp-dis-upstream is kept ready for the cutover.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
components:
  - ../components/platform-apim
patches:
  - target:
      kind: Backend
      name: dp-dis-upstream
    patch: |-
      - op: replace
        path: /spec/endpoints/0/fqdn/hostname
        value: dialogporten.tt02.dis-core.altinn.no
  - target:
      kind: BackendTLSPolicy
      name: dp-dis-upstream-tls
    patch: |-
      - op: replace
        path: /spec/validation/hostname
        value: dialogporten.tt02.dis-core.altinn.no
  - target:
      kind: HTTPRoute
      name: dialogporten
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: platform.tt02.altinn.no
      - op: replace
        path: /spec/rules/0/filters/0/urlRewrite/hostname
        value: platform.tt02.altinn.no
      - op: replace
        path: /spec/rules/1/filters/0/urlRewrite/hostname
        value: platform.tt02.altinn.no
      - op: replace
        path: /spec/rules/2/filters/0/urlRewrite/hostname
        value: platform.tt02.altinn.no
