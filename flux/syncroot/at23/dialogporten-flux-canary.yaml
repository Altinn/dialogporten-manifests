# Temporary canary for the RFC 0019 acceptance run (altinn-platform#4384), so
# rollout and source failures are tested here instead of on dialogporten-apps.
# Remove this file, and the canary subscription in Altinn/dialogporten, after the run.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dialogporten-flux-canary
  namespace: product-dialogporten
spec:
  interval: 5m
  provider: azure
  url: oci://altinncr.azurecr.io/dialogporten/dialogporten-sync
  ref:
    tag: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dialogporten-flux-canary
  namespace: product-dialogporten
spec:
  interval: 10m
  retryInterval: 5m
  timeout: 3m
  path: ./environments/at23/flux-canary
  prune: true
  sourceRef:
    kind: OCIRepository
    name: dialogporten-flux-canary
  targetNamespace: product-dialogporten
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: dialogporten-flux-canary
      namespace: product-dialogporten
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: dialogporten-flux-canary
  namespace: product-dialogporten
spec:
  suspend: true
  providerRef:
    name: dialogporten-github
  # Successful rollouts only, like dialogporten-reconciliation.
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: dialogporten-flux-canary
  inclusionList:
    - "^Health check passed in "
  eventMetadata:
    schema_version: "1"
    product: dialogporten
    environment: at23
    cluster: dis-core-at23-aks
    repository: Altinn/dialogporten
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: dialogporten-flux-canary-errors
  namespace: product-dialogporten
spec:
  suspend: true
  providerRef:
    name: dialogporten-github
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: dialogporten-flux-canary
    - kind: OCIRepository
      name: dialogporten-flux-canary
  eventMetadata:
    schema_version: "1"
    product: dialogporten
    environment: at23
    cluster: dis-core-at23-aks
    repository: Altinn/dialogporten
