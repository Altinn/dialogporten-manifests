# Sends the results of at23 rollouts to Altinn/dialogporten as repository_dispatch
# events (RFC 0019). The platform creates flux-dispatch-github-token and renews its
# token. Setting suspend: true on the Alerts stops the events, not the rollout.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: dialogporten-github
  namespace: product-dialogporten
spec:
  type: githubdispatch
  address: https://github.com/Altinn/dialogporten
  secretRef:
    name: flux-dispatch-github-token
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: dialogporten-reconciliation
  namespace: product-dialogporten
spec:
  suspend: false
  providerRef:
    name: dialogporten-github
  # Successful rollouts only. Every event sent starts a workflow run, and the
  # workflow ignores progress events. dialogporten-errors sends the failures.
  eventSeverity: info
  # Not dialogporten-migration: the workflow would count its "Health check passed"
  # as a successful rollout.
  eventSources:
    - kind: Kustomization
      name: dialogporten-apps
  inclusionList:
    - "^Health check passed in "
  eventMetadata:
    schema_version: "1"
    product: dialogporten
    environment: at23
    cluster: dis-core-at23-aks
    repository: Altinn/dialogporten
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: dialogporten-errors
  namespace: product-dialogporten
spec:
  suspend: false
  providerRef:
    name: dialogporten-github
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: dialogporten-apps
    - kind: Kustomization
      name: dialogporten-migration
    - kind: OCIRepository
      name: dialogporten-manifests
  eventMetadata:
    schema_version: "1"
    product: dialogporten
    environment: at23
    cluster: dis-core-at23-aks
    repository: Altinn/dialogporten
