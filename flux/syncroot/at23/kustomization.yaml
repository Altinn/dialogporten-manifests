# syncroot for at23 environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - dialogporten-receiver.yaml
patches:
  - target:
      kind: Kustomization
      name: dialogporten-apps
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: dialogporten-apps
        namespace: product-dialogporten
      spec:
        path: ./environments/at23
        # RFC 0019 pilot: wait for the rollout, so Flux sends "Health check passed".
        # 15m covers a new node plus the 5-minute startup probe window. A stuck
        # rollout fails earlier, at the Deployment's 10-minute progress deadline.
        wait: true
        timeout: 15m
  - target:
      kind: Kustomization
      name: dialogporten-migration
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: dialogporten-migration
        namespace: product-dialogporten
      spec:
        path: ./environments/at23/migration
