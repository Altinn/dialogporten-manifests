# syncroot for at23 environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - dialogporten-receiver.yaml
patches:
  - target:
      kind: Kustomization
      name: dialogporten-apps
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: dialogporten-apps
        namespace: product-dialogporten
      spec:
        path: ./environments/at23
