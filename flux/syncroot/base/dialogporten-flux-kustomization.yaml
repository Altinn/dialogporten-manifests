apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dialogporten-apps
  namespace: product-dialogporten
spec:
  interval: 10m
  path: ./environments/at23
  prune: true
  sourceRef:
    kind: OCIRepository
    name: dialogporten-manifests
  targetNamespace: product-dialogporten
  # Success events fire only when workloads are healthy (kstatus), not merely applied;
  # required for HealthCheckFailed to be reachable. Timeout must exceed worst normal rollout.
  timeout: 5m
  wait: true
