apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dialogporten-migration
  namespace: product-dialogporten
spec:
  interval: 10m
  timeout: 30m
  wait: true
  force: true
  prune: true
  path: ./environments/at23/migration
  sourceRef:
    kind: OCIRepository
    name: dialogporten-manifests
  targetNamespace: product-dialogporten
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dialogporten-apps
  namespace: product-dialogporten
spec:
  interval: 10m
  prune: true
  path: ./environments/at23
  dependsOn:
    - name: dialogporten-migration
  sourceRef:
    kind: OCIRepository
    name: dialogporten-manifests
  targetNamespace: product-dialogporten
