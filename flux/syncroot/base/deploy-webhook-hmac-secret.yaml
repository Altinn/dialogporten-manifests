# Materializes the shared HMAC secret the flux-dispatch Provider signs webhook
# payloads with (spec.secretRef.name in deploy-webhook-provider.yaml). No literal
# token is committed here — the value is pulled from Key Vault at sync time.
#
# NOTE: this reuses the product's own SecretStore (dialogporten-azure-kv, defined in
# manifests/common/base/external-secrets.yaml and reconciled into this namespace via
# the dialogporten-apps Kustomization). Per Task 3 Step 5, the platform stores the
# `flux-dispatch-hmac-token` secret in the *platform* Key Vault, same pattern as other
# dis-* service secrets — for this ExternalSecret to sync, platform provisioning must
# either replicate that secret into the product's own vault under the same key name,
# or this SecretStore reference must be swapped for a platform-provided store once
# Task 3/6/7 land. Flagged as an open item; not verifiable without cluster/vault access.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-dispatch-hmac-token
  namespace: product-dialogporten
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dialogporten-azure-kv
  target:
    name: flux-dispatch-hmac-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: flux-dispatch-hmac-token
