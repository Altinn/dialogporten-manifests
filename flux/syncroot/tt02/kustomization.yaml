apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Kustomization
      name: dialogporten-apps
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: dialogporten-apps
        namespace: product-dialogporten
      spec:
        path: ./environments/tt02
  - target:
      kind: Receiver
      name: dialogporten-manifests
    patch: |-
      - op: replace
        path: /spec/oidcProviders/0/audience
        value: https://flux-webhook.tt02.dis-core.altinn.cloud
