# Disable the service app in at23: scale the Deployment to 0 replicas and
# remove the KEDA ScaledObject so it does not scale the workload back up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service
spec:
  replicas: 0
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: service
$patch: delete
