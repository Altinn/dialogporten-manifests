# Test Deployment for the RFC 0019 acceptance run. The pod becomes ready
# READY_AFTER_SECONDS after it starts. docs/summary.md#flux-canary-in-at23 lists
# the changes that make the rollout fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogporten-flux-canary
  labels:
    app.kubernetes.io/name: dialogporten-flux-canary
    app.kubernetes.io/part-of: dialogporten
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: dialogporten-flux-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dialogporten-flux-canary
        app.kubernetes.io/part-of: dialogporten
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: mcr.microsoft.com/azurelinux/busybox:1.36.1-azl3.0.20261105@sha256:141581e735b73dfed58f739c7fc8f5bd37546cba8de22051550eb9dfeecdcc2e
          command:
            - sh
            - -c
            - |
              trap 'exit 0' TERM
              sleep "$READY_AFTER_SECONDS" & wait $!
              touch /tmp/ready
              while true; do sleep 3600 & wait $!; done
          env:
            - name: READY_AFTER_SECONDS
              value: "1"
          readinessProbe:
            exec:
              command: [sh, -c, test -f /tmp/ready]
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
