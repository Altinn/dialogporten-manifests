apiVersion: v1
kind: ConfigMap
metadata:
  name: db-provisioner-runtime
  labels:
    app.kubernetes.io/instance: at23
data:
  PGHOST: dp-be-test-postgres2-i7se3jtjey3lo.postgres.database.azure.com
  # One entry per workload that gets a login role. "applicationIdentity" is the
  # ApplicationIdentity resource in this namespace; "profile" is the least-privilege
  # role the login role is granted.
  PROVISION_WORKLOADS: |-
    [
      { "applicationIdentity": "web-api-so", "profile": "dp_api_dml" },
      { "applicationIdentity": "web-api-eu", "profile": "dp_api_dml" },
      { "applicationIdentity": "graphql", "profile": "dp_api_dml" },
      { "applicationIdentity": "service", "profile": "dp_service_dml" },
      { "applicationIdentity": "sync-subject-resource-mappings-job", "profile": "dp_sync_sr_mappings" },
      { "applicationIdentity": "sync-resource-policy-information-job", "profile": "dp_sync_rp_info" },
      { "applicationIdentity": "reindex-dialogsearch-job", "profile": "dp_reindex_search" }
    ]
