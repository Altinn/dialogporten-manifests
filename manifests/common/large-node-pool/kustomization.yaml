apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Reindex requests 4 CPUs; D8 nodes provide room for AKS and platform overhead.
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: reindex-dialogsearch-job
      labelSelector: app.kubernetes.io/part-of=dialogporten
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: large-node-pool
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                nodeSelector:
                  dis.altinn.cloud/node-class: large
                tolerations:
                  - key: dis.altinn.cloud/node-class
                    operator: Equal
                    value: large
                    effect: NoSchedule
