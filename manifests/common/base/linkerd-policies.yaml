# Linkerd inbound authorization for dialogporten pods (port 8080).
#
# defaultInboundPolicy is deny, so :8080 is default-deny. Access is scoped per
# HTTP route, so the kubelet reaches only its probe paths — never the application:
#   - "/"        -> mesh (mTLS) identity: internal dialogporten components, the
#                   arbeidsflate BFF, and traefik ingress. This is all real traffic,
#                   including /health and /health/deep for availability checks from
#                   outside (e.g. through the dis edge proxy).
#   - exactly /health/startup, /health/liveness, /health/readiness -> the kubelet,
#                   for the probes, which hit :8080 unmeshed from the node. Exact
#                   paths keep node-sourced traffic off everything else.
#
# Keep the probe matches Exact and longer than any overlapping match: before Linkerd
# edge-26.9.1 the proxy ranks path matches by length alone, so an Exact match ties
# an equally long PathPrefix instead of beating it (linkerd2-proxy#4604). Linkerd
# matches paths case-sensitively and ASP.NET routing does not, so "/Health/liveness"
# arrives via "/": this split keeps node traffic off the API, it does not hide health.
#
# Defining HTTPRoutes replaces the Server's default catch-all, so "/" is an
# explicit catch-all (every request except the probe paths matches it). Node subnet on
# dis-core clusters is 10.205.0.0/16 (+ fd12:2291:d70a::/48), verified on
# at22/at23 — deliberately not the pod subnet (10.240.0.0/16).
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: dialogporten-http
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dialogporten
  port: 8080
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: dialogporten-mesh-authn
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  identities:
    # Internal dialogporten components (graphql, service, web-api-eu, web-api-so).
    - "*.product-dialogporten.serviceaccount.identity.linkerd.cluster.local"
    # Arbeidsflate BFF.
    - "bff.product-arbeidsflate.serviceaccount.identity.linkerd.cluster.local"
    # Ingress — covers all external traffic, which reaches us via traefik.
    - "altinn-traefik.traefik.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: dialogporten-kubelet
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  # Node subnet (kubelet source) — excludes the pod subnet (10.240.0.0/16).
  networks:
    - cidr: 10.205.0.0/16
    - cidr: fd12:2291:d70a::/48
---
# Catch-all route: everything except the probe paths, authorized by mesh identity below.
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: dialogporten-app
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: dialogporten-http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
# Probe route: exactly the startup/liveness/readiness paths the deployments probe,
# authorized for the kubelet below.
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata:
  name: dialogporten-health
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  parentRefs:
    - group: policy.linkerd.io
      kind: Server
      name: dialogporten-http
  rules:
    - matches:
        - path:
            type: Exact
            value: /health/startup
        - path:
            type: Exact
            value: /health/liveness
        - path:
            type: Exact
            value: /health/readiness
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: dialogporten-allow-meshed
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: dialogporten-app
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: dialogporten-mesh-authn
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: dialogporten-allow-kubelet
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: dialogporten-health
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: dialogporten-kubelet
