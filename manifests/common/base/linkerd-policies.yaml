# Linkerd inbound authorization for dialogporten pods (port 8080).
#
# The cluster runs `defaultInboundPolicy: deny`, so this Server's port is
# default-deny. Two ways in are authorized:
#   1. Mesh (mTLS) identity — internal dialogporten components, the arbeidsflate
#      BFF, and traefik ingress. This is how all real traffic arrives; the Azure
#      load balancer terminates at traefik (services are ClusterIP) and telemetry
#      is push-based (OTLP -> otel-collector), so nothing else reaches 8080 meshed.
#   2. The kubelet, for the liveness/readiness/startup probes (/health/*) which
#      hit 8080 directly and are unmeshed. Scoped to the node subnet — on dis-core
#      clusters the nodes live in 10.205.0.0/16 (+ fd12:2291:d70a::/48),
#      deliberately NOT the pod subnet (10.240.0.0/16 / fd10:…), so pods cannot
#      bypass mesh auth via the network rule.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: dialogporten-http
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dialogporten
  port: 8080
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: dialogporten-mesh-authn
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  identities:
    # Internal dialogporten components (graphql, service, web-api-eu, web-api-so).
    - "*.product-dialogporten.serviceaccount.identity.linkerd.cluster.local"
    # Arbeidsflate BFF.
    - "bff.product-arbeidsflate.serviceaccount.identity.linkerd.cluster.local"
    # Ingress — covers all external traffic, which reaches us via traefik.
    - "altinn-traefik.traefik.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: dialogporten-allow-meshed
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: dialogporten-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: dialogporten-mesh-authn
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: dialogporten-kubelet
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  # Node subnet (kubelet source) for health probes — excludes the pod subnet.
  networks:
    - cidr: 10.205.0.0/16
    - cidr: fd12:2291:d70a::/48
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: dialogporten-allow-kubelet
  labels:
    app.kubernetes.io/part-of: dialogporten
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: dialogporten-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: NetworkAuthentication
      name: dialogporten-kubelet
