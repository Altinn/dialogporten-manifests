name: Publish Flux artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  SYNCROOT_ARTIFACT_NAME: dialogporten/syncroot
  APP_ARTIFACT_NAME: dialogporten/dialogporten-sync

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flux-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-syncroot:
    name: Publish syncroot artifact
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # The self-hosted runners are Azure Container App Jobs, which inject a managed
    # identity endpoint. flux --provider=azure resolves credentials through
    # DefaultAzureCredential, so it tries ManagedIdentityCredential, gets HTTP 400
    # (the job has a user-assigned identity and flux passes no client id), and
    # aborts the whole chain before reaching the az login session from azure/login.
    # Clearing these makes that credential report itself unavailable again, so the
    # chain falls through to the CLI credential as it does on GitHub-hosted runners.
    # Remove once Altinn/altinn-platform#3912 reaches build-push-image, which still
    # pins setup-flux-acr@e095eaa (2026-06-09) — predating the fix.
    env:
      IDENTITY_ENDPOINT: ""
      MSI_ENDPOINT: ""
    strategy:
      matrix:
        tag: [at23]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate syncroot structure
        shell: bash
        run: |
          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            if [ ! -f "./flux/syncroot/${env}/kustomization.yaml" ]; then
              echo "Error: Missing ./flux/syncroot/${env}/kustomization.yaml"
              exit 1
            fi
          done

      - name: Build and push syncroot artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@470eaf98af2ab545e7e840055a538d73e40c3c80 # main
        with:
          image_name: ${{ env.SYNCROOT_ARTIFACT_NAME }}
          tag: ${{ matrix.tag }}
          workdir: ./flux/syncroot
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

  publish-app-manifests:
    name: Publish app manifests artifact
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    # See the comment on publish-syncroot above.
    env:
      IDENTITY_ENDPOINT: ""
      MSI_ENDPOINT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize
        env:
          # Official kustomize binary (no Docker, no sudo) so this job can run on
          # self-hosted runners, which ship neither kustomize nor kubectl.
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize versioning=semver extractVersion=^kustomize\/(?<version>v.+)$
          KUSTOMIZE_VERSION: v5.8.1
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac

          dest="${RUNNER_TEMP:-/tmp}/kustomize-bin"
          mkdir -p "$dest"
          tarball="kustomize_${KUSTOMIZE_VERSION}_linux_${arch}.tar.gz"
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tarball}"

          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "$url" -o "$dest/$tarball"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO "$dest/$tarball" "$url"
          else
            echo "::error::Neither curl nor wget is available on the runner."
            exit 1
          fi

          tar -xzf "$dest/$tarball" -C "$dest" kustomize
          rm -f "$dest/$tarball"
          chmod +x "$dest/kustomize"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/kustomize" version

      - name: Validate app manifests structure
        shell: bash
        run: |
          set -euo pipefail

          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            if [ ! -f "./manifests/environments/${env}/kustomization.yaml" ]; then
              echo "Error: Missing ./manifests/environments/${env}/kustomization.yaml"
              exit 1
            fi
          done

          for dir in ./manifests/apps/*/ ./manifests/jobs/*/; do
            if [ ! -f "${dir}base/kustomization.yaml" ]; then
              echo "Error: Missing ${dir}base/kustomization.yaml"
              exit 1
            fi
          done

          if [ -d "./manifests/apps/components" ] || [ -d "./manifests/apps/base" ]; then
            echo "Error: Legacy app manifest paths detected (manifests/apps/components or manifests/apps/base)."
            exit 1
          fi

          if grep -R --include='kustomization.yaml' -n 'patchesStrategicMerge' ./manifests/environments; then
            echo "Error: Found deprecated patchesStrategicMerge usage."
            exit 1
          fi

          build_kustomize() {
            local path="$1"
            if command -v kustomize >/dev/null 2>&1; then
              kustomize build "$path" >/dev/null
              return
            fi
            if command -v kubectl >/dev/null 2>&1; then
              kubectl kustomize "$path" >/dev/null
              return
            fi
            echo "Error: Neither 'kustomize' nor 'kubectl' found in runner PATH."
            exit 1
          }

          for dir in ./manifests/environments/*/; do
            env=$(basename "$dir")
            build_kustomize "./manifests/environments/${env}"
            build_kustomize "./flux/syncroot/${env}"
          done

      - name: Build and push app manifests artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@470eaf98af2ab545e7e840055a538d73e40c3c80 # main
        with:
          image_name: ${{ env.APP_ARTIFACT_NAME }}
          tag: main
          workdir: ./manifests
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
